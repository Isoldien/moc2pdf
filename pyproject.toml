[project]
name = "moc2pdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Habibur Rahman", email = "habib@isoldien.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "python-frontmatter>=1.3.0",
    "typer>=0.27.1",
    "weasyprint>=69.0",
]

[project.scripts]
moc2pdf = "moc2pdf:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
